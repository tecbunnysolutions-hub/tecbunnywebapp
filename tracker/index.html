<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --todo: #94a3b8; --doing: #f59e0b; --done: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --card: #1a1f29; --text: #e8ebf1; --muted: #8b93a3; --line: #2a303c; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.4rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .bar i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input, select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  input[type=text] { flex: 1 1 200px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  li .title { flex: 1 1 160px; word-break: break-word; }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .meta { color: var(--muted); font-size: .8rem; }
  .overdue { color: #dc2626; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }
  .del { padding: 4px 8px; }
</style>
</head>
<body>
<main>
  <h1>Tracker</h1>
  <div class="stats">
    <div class="stat"><b id="sTodo">0</b><span>To do</span></div>
    <div class="stat"><b id="sDoing">0</b><span>In progress</span></div>
    <div class="stat"><b id="sDone">0</b><span>Done</span></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>

  <form id="form">
    <input type="text" id="title" placeholder="Add a task…" aria-label="Task title" required maxlength="200">
    <input type="date" id="due" aria-label="Due date">
    <button class="primary" type="submit">Add</button>
  </form>

  <div class="filters" id="filters" role="group" aria-label="Filter tasks"></div>
  <ul id="list"></ul>
</main>

<script>
const STATUSES = [
  { id: 'todo', label: 'To do', color: 'var(--todo)' },
  { id: 'doing', label: 'In progress', color: 'var(--doing)' },
  { id: 'done', label: 'Done', color: 'var(--done)' },
];
const KEY = 'tracker.tasks.v1';
let tasks = load();
let filter = 'all';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {}
}

const $ = id => document.getElementById(id);

function render() {
  const count = s => tasks.filter(t => t.status === s).length;
  $('sTodo').textContent = count('todo');
  $('sDoing').textContent = count('doing');
  $('sDone').textContent = count('done');
  $('progress').style.width = (tasks.length ? count('done') / tasks.length * 100 : 0) + '%';

  $('filters').replaceChildren(...[{ id: 'all', label: 'All' }, ...STATUSES].map(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = f.label;
    b.setAttribute('aria-pressed', filter === f.id);
    b.onclick = () => { filter = f.id; render(); };
    return b;
  }));

  const today = new Date().toISOString().slice(0, 10);
  const shown = tasks.filter(t => filter === 'all' || t.status === filter);
  const list = $('list');
  if (!shown.length) {
    list.innerHTML = '<li class="empty" style="display:block">No tasks yet.</li>';
    return;
  }
  list.replaceChildren(...shown.map(t => {
    const li = document.createElement('li');
    if (t.status === 'done') li.className = 'done';

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = STATUSES.find(s => s.id === t.status).color;

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = t.title;

    const due = document.createElement('span');
    due.className = 'meta';
    if (t.due) {
      due.textContent = 'Due ' + t.due;
      if (t.due < today && t.status !== 'done') { due.classList.add('overdue'); due.textContent += ' (overdue)'; }
    }

    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Status for ' + t.title);
    STATUSES.forEach(s => {
      const o = new Option(s.label, s.id, false, s.id === t.status);
      sel.add(o);
    });
    sel.onchange = () => { t.status = sel.value; save(); render(); };

    const del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Delete ' + t.title);
    del.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); save(); render(); };

    li.append(dot, title, due, sel, del);
    return li;
  }));
}

$('form').onsubmit = e => {
  e.preventDefault();
  const title = $('title').value.trim();
  if (!title) return;
  tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, due: $('due').value, status: 'todo' });
  $('form').reset();
  save();
  render();
};

render();
</script>
</body>
</html>
