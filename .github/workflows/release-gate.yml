name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy
        required: true
      rollback_tag:
        description: Rollback tag reference
        required: true
      incident_channel:
        description: Incident communication channel
        required: true

env:
  NODE_VERSION: '22'

jobs:
  gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate DB readiness
        run: npm run validate:db-readiness

      - name: Validate infra/observability readiness
        run: npm run validate:infra-observability

      - name: Validate launch readiness contract
        run: npm run validate:launch-readiness

      - name: Validate runtime evidence artifacts
        run: npm run validate:runtime-evidence-artifacts

      - name: Validate runtime readiness evidence (strict)
        run: npm run validate:runtime-readiness

      - name: Verify security posture
        run: npm audit --audit-level=high

      - name: Run production smoke tests
        run: npm run smoke:production

      - name: Emit release gate summary
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          ROLLBACK_TAG: ${{ github.event.inputs.rollback_tag }}
          INCIDENT_CHANNEL: ${{ github.event.inputs.incident_channel }}
        run: |
          echo "Release tag: $RELEASE_TAG"
          echo "Rollback tag: $ROLLBACK_TAG"
          echo "Incident channel: $INCIDENT_CHANNEL"
          echo "Release gate checks and production smoke tests completed successfully."
