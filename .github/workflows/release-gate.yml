name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy
        required: true
      rollback_tag:
        description: Rollback tag reference
        required: true
      incident_channel:
        description: Incident communication channel
        required: true

env:
  NODE_VERSION: '20'

jobs:
  gate:
    name: Production Release Gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate DB readiness
        run: npm run validate:db-readiness

      - name: Validate infra/observability readiness
        run: npm run validate:infra-observability

      - name: Validate launch readiness contract
        run: npm run validate:launch-readiness

      - name: Verify security posture (non-zero allowed for governance handling)
        run: npm audit --audit-level=high || true

      - name: Emit release gate summary
        run: |
          echo "Release tag: ${{ github.event.inputs.release_tag }}"
          echo "Rollback tag: ${{ github.event.inputs.rollback_tag }}"
          echo "Incident channel: ${{ github.event.inputs.incident_channel }}"
          echo "Release gate checks completed."
