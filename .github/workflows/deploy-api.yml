name: Deploy API to VPS

# Builds the api Docker image in CI (the LV10 VPS is too small for reliable
# Next.js builds), pushes it to GHCR, then pulls and restarts it on the VPS.
#
# Required GitHub secrets:
#   VPS_HOST          - 203.57.85.100
#   VPS_USER          - root (or a dedicated deploy user)
#   VPS_SSH_KEY       - private key for the deploy user (public key on the VPS)
#   VPS_SSH_PORT      - optional, defaults to 22
#   GHCR_PAT          - PAT with read:packages so the VPS can pull from GHCR
#   GHCR_USERNAME     - GitHub username owning the PAT
#   NEXT_PUBLIC_*     - public build-time config (see docker-compose.api.yml)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'scripts/generate-api-manifest.mjs'
      - 'docker-compose.api.yml'
      - 'Caddyfile.api'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  build:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MGMT_URL=${{ secrets.NEXT_PUBLIC_MGMT_URL }}
            NEXT_PUBLIC_SUPERADMIN_URL=${{ secrets.NEXT_PUBLIC_SUPERADMIN_URL }}
            NEXT_PUBLIC_WABA_URL=${{ secrets.NEXT_PUBLIC_WABA_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE,GHCR_USERNAME,GHCR_PAT
          script: |
            set -e
            cd /opt/tecbunny
            git fetch origin main
            git checkout main
            git pull --ff-only

            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            export API_IMAGE="${IMAGE}:${{ github.sha }}"
            docker compose -f docker-compose.api.yml pull api
            docker compose -f docker-compose.api.yml up -d --remove-orphans
            docker image prune -f
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://api.tecbunny.store/api/health"; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i: not healthy yet, retrying in 10s"
            sleep 10
          done
          echo "API failed health check after deploy"
          exit 1
